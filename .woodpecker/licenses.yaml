#
# Licenses (ADR-08 and RNF-15). SPDX headers are checked on every push; the slower ScanCode
# Toolkit scan only runs weekly or on demand. The licenses of the vcpkg dependencies are
# checked in core.yaml, against the dependencies it has just built.

when:
  - event: [push, pull_request, manual]
  - event: cron
    cron: weekly

steps:
  - name: spdx-headers
    image: python:3.13-slim
    commands:
      - python3 tools/ci/check_licenses.py

  # ScanCode 32.5.0 does not start with pluggy 1.7 (checked on 2026-11-07); it does with 1.6.
  - name: scancode
    image: python:3.13-slim
    when:
      - event: [cron, manual]
    commands:
      - pip install --quiet scancode-toolkit==32.5.0 "pluggy<1.7"
      - >-
        scancode --license --processes 2 --quiet
        --ignore "build/*" --ignore ".vcpkg/*" --ignore ".ndk/*"
        --json-pp scancode.json .
      - python3 tools/ci/check_licenses.py --scancode scancode.json
