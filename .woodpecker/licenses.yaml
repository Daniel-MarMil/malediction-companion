#
# Licencias (ADR-08 y RNF-15). Las cabeceras SPDX se comprueban en cada push; el análisis
# con ScanCode Toolkit, que tarda más, solo en la ejecución semanal o a mano. Las licencias
# de las dependencias de vcpkg se comprueban en core.yaml, con las ya compiladas.

when:
  - event: [push, pull_request, manual]
  - event: cron
    cron: semanal

steps:
  - name: cabeceras-spdx
    image: python:3.13-slim
    commands:
      - python3 tools/ci/check_licenses.py

  # ScanCode 32.5.0 no arranca con pluggy 1.7 (comprobado el 07-11-2026); con 1.6 sí.
  - name: scancode
    image: python:3.13-slim
    when:
      - event: [cron, manual]
    commands:
      - pip install --quiet scancode-toolkit==32.5.0 "pluggy<1.7"
      - >-
        scancode --license --processes 2 --quiet
        --ignore "build/*" --ignore ".vcpkg/*" --ignore ".ndk/*"
        --json-pp scancode.json .
      - python3 tools/ci/check_licenses.py --scancode scancode.json
