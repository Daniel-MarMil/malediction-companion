#
# C++ core on every push and pull request: formatting and clang-tidy, AddressSanitizer and
# UBSan, coverage of at least 90 % and dependency licenses (RNF-15, RNF-17 and RNF-19).
# Everything runs in a single step so the tools are installed and the dependencies built
# only once, as Codeberg CI's fair use asks. The long-running checks are in extended.yaml.
# It does not run when a push only changes documentation.
# Before enabling it, pin the image by its digest (ubuntu:26.04@sha256:...).

when:
  - event: [push, pull_request]
    path:
      exclude: ["docs/**", "**/*.md", "LICENSE", "LICENSES/**", "NOTICE"]
  - event: manual

steps:
  - name: tests
    image: ubuntu:26.04
    commands:
      - tools/ci/ci.sh lint asan coverage licenses
