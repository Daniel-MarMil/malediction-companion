#
# Núcleo C++ en cada push y pull request: formato y clang-tidy, AddressSanitizer y UBSan,
# cobertura mínima del 90 % y licencias de las dependencias (RNF-15, RNF-17 y RNF-19).
# Va todo en un solo paso para instalar las herramientas y compilar las dependencias una
# sola vez, como pide el uso razonable de Codeberg CI. Las pruebas largas están en
# extended.yaml. No se ejecuta si el push solo cambia documentación.
# Antes de activarla, fija la imagen por su digest (ubuntu:26.04@sha256:...).

when:
  - event: [push, pull_request]
    path:
      exclude: ["docs/**", "**/*.md", "LICENSE", "LICENSES/**", "NOTICE"]
  - event: manual

steps:
  - name: pruebas
    image: ubuntu:26.04
    commands:
      - tools/ci/ci.sh lint asan coverage licenses
