#
# Long-running checks, once a week or on demand: ThreadSanitizer, Release, fuzzing and the
# Android library built with NDK r30 and aligned to 16 KB (RNF-19 and RNF-20).
# For the weekly run, create a scheduled task (Cron) named "weekly" in Woodpecker.
# Before enabling it, pin the image by its digest (ubuntu:26.04@sha256:...).

when:
  - event: cron
    cron: weekly
  - event: manual

steps:
  - name: tsan-and-release
    image: ubuntu:26.04
    commands:
      - tools/ci/ci.sh tsan release

  - name: fuzzing
    image: ubuntu:26.04
    commands:
      - tools/ci/ci.sh fuzz

  - name: android
    image: ubuntu:26.04
    commands:
      - tools/ci/ci.sh android
